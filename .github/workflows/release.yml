name: release

# A tag states the whole version and is the only trigger. The build that publishes is the build of this source,
# with a provenance attestation, and the push to nuget.org waits for the `nuget-release` environment approval.
#
# Requirements outside this file, all on the nuget.org account:
#   - the `radivum-oss` package ID prefix reserved
#   - a trusted publishing policy that trusts this repository, this workflow file and the `nuget-release`
#     environment, with a scope that allows publishing the new package `radivum-oss`
#   - the account name in the repository variable NUGET_USER
# There is no long-lived API key: the step below exchanges the workflow's OIDC token for a single-use key.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  deployments: write # the nuget-release environment creates a deployment object
  attestations: write # attest-build-provenance
  id-token: write # NuGet/login and the attestation exchange an OIDC token

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test the tag
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          dotnet test Radivum.Oss.sln --configuration Release -p:Version="$version"

      - name: Pack at the tagged version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for project in src/Radivum.Model src/Radivum.Azure src/Radivum.Graph \
                         src/Radivum.Oss.Analysis src/Radivum.Oss.Reporting \
                         src/Radivum.Oss.Commands src/Radivum.Oss.Cli; do
            dotnet pack "$project" --configuration Release --no-build --nologo --output ./packages -p:Version="$version"
          done

      - name: Attest the package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ./packages/radivum-oss.*.nupkg

      - name: Checksums
        run: |
          set -eu
          cd packages
          sha256sum ./*.nupkg > SHA256SUMS

      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the tool package
        run: |
          set -eu
          dotnet nuget push ./packages/radivum-oss.*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ./packages/radivum-oss.*.nupkg ./packages/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags

      # nuget.org validates a new package before listing it and its search and registration indexes follow later; the
      # first release took about ten minutes to appear and longer to resolve. The push has already succeeded here, so
      # this step only has to outwait that and then prove the published bytes run.
      - name: Install from nuget.org and run the sample
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          installed=false
          for attempt in $(seq 1 60); do
            if dotnet tool install radivum-oss --tool-path ./tool --version "$version"; then
              installed=true
              break
            fi
            echo "attempt $attempt of 60: not available on nuget.org yet"
            sleep 30
          done
          if [ "$installed" != "true" ]; then
            echo "::error::radivum-oss $version was pushed but is not installable from nuget.org after 30 minutes; check its validation status on nuget.org."
            exit 1
          fi
          ./tool/radivum-oss report --snapshot samples/network-snapshot.sample.v1.json --out ./sample-output
          test -f ./sample-output/network-report.md
