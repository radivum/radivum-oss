name: dco

# The Developer Certificate of Origin is the whole contribution model, so the check is the control rather than a
# courtesy: every commit in a pull request states that its author has the right to submit it.

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by line
        run: |
          set -eu
          range="origin/${{ github.base_ref }}..HEAD"
          missing=0
          for sha in $(git rev-list "$range"); do
            if git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              continue
            fi

            subject=$(git log -1 --format=%s "$sha")
            echo "::error::commit $sha ('$subject') has no Signed-off-by line. Amend it with: git commit --amend --signoff"
            missing=1
          done

          exit $missing
