name: ci

# The second, independent proof that this tree stands alone: a clean machine with no private feed, no private
# repository and no secret, on three operating systems.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Radivum.Oss.sln

      - name: Build
        run: dotnet build Radivum.Oss.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Radivum.Oss.sln --no-build --configuration Release

  smoke:
    name: pack, install and run the sample
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack the tool and its libraries
        run: |
          set -eu
          for project in src/Radivum.Model src/Radivum.Azure src/Radivum.Graph \
                         src/Radivum.Oss.Analysis src/Radivum.Oss.Reporting \
                         src/Radivum.Oss.Commands src/Radivum.Oss.Cli; do
            dotnet pack "$project" --configuration Release --nologo --output ./packages
          done

      # Path A of the README, exactly as a reader would run it, against the package this commit produces. The
      # repository's NuGet.config clears inherited sources and maps every package to nuget.org, and `--add-source`
      # cannot be combined with source mapping, so the install runs against a config whose only source is ./packages.
      - name: Install the tool from the packed output
        run: |
          set -eu
          version="$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="local" value="%s/packages" />\n  </packageSources>\n</configuration>\n' "$(pwd)" > ./.smoke-nuget.config
          dotnet tool install radivum-oss --tool-path ./tool --configfile ./.smoke-nuget.config --version "$version"

      - name: Run the sample
        run: ./tool/radivum-oss report --snapshot samples/network-snapshot.sample.v1.json --out ./sample-output

      - name: Assert the bundle
        run: |
          set -eu
          for file in analysis-manifest.json findings.json network-graph.json network-report.md network-snapshot.json network-topology.md; do
            test -f "./sample-output/$file" || { echo "missing $file"; exit 1; }
          done
          grep -q '"id": "topology"' ./sample-output/analysis-manifest.json
          grep -A1 '"id": "topology"' ./sample-output/analysis-manifest.json | grep -q 'available'
